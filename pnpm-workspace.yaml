packages:
  - 'packages/*'
  - 'packages/configs/*'
  - 'examples/*'
  # Fetched and installed on its own, with npm: see the `starters` job of ci.yml.
  - '!examples/starter'
  - 'docs'

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true

# @anthropic-ai/sandbox-runtime asks for zod ^3.25.0 but imports `zod/v3` only, which zod 4 ships
# too (see its README): one zod 4 for the whole tree rather than a zod 3 of its own.
overrides:
  '@anthropic-ai/sandbox-runtime>zod': ^4.6.7

minimumReleaseAgeExclude:
  - '@ai-sdk/provider-utils@5.0.70'
