packages:
  - 'packages/*'
  - 'packages/configs/*'
  - 'examples/*'
  - 'docs'

allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true

# Some harness adapters pin ws exactly (8.21.0): without one version, @ai-sdk/harness is installed
# once per ws and its types no longer match across the workspace.
overrides:
  ws: ^8.22.0

minimumReleaseAgeExclude:
  - '@ai-sdk/provider-utils@5.0.70'
