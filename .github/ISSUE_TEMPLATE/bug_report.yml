name: Bug report
description: Report a reproducible bug in one of the packages.
title: 'bug: '
labels: ['bug', 'needs triage']
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - 'ai-sdk-sandbox-sbx'
        - 'ai-sdk-sandbox-microsandbox'
        - 'ai-sdk-sandbox-runtime'
        - 'ai-sdk-harness-plugins'
        - 'ai-sdk-harness-sessions'
        - 'ai-sdk-harness-workspace'
        - 'ai-sdk-harness-approval'
        - 'ai-sdk-harness-network'
        - 'example-next-chat'
        - 'Documentation'
        - 'Other'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a repository link or a small code sample.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Node:
        - pnpm:
        - sbx (`sbx version`):
        - microsandbox (`msb --version`):
        - srt (`@anthropic-ai/sandbox-runtime` version, and `bwrap --version` on Linux):
        - @ai-sdk/harness:
        - OS:
    validations:
      required: true
