name: Support question
description: Ask for help using one of the packages.
title: 'support: '
labels: ['question', 'needs triage']
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - 'ai-sdk-sandbox-sbx'
        - 'ai-sdk-harness-plugins'
        - 'ai-sdk-harness-sessions'
        - 'ai-sdk-harness-approval'
        - 'example-next-chat'
        - 'Documentation'
        - 'Other'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain what you are trying to build.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration or code
      render: ts
