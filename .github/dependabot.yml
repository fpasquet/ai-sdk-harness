version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '08:00'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # The Node.js base image of the service images, pinned by digest.
  - package-ecosystem: 'docker'
    directories:
      - '/packages/sandbox-gce'
      - '/packages/sandbox-cloud-run'
    schedule:
      interval: 'weekly'
      time: '08:00'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    ignore:
      # Node.js follows the packages' engines, on purpose.
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
    groups:
      node-image:
        patterns:
          - 'node'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '08:00'
      timezone: 'Europe/Paris'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
    # One pull request a week for every minor and patch update: fewer to review, and no two of them
    # rewriting pnpm-lock.yaml side by side, which auto-merge would merge one after the other.
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
