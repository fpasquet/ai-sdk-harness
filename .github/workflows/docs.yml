name: Docs

# Builds the documentation site as a static export (`docs/out`) and deploys it
# to Cloudflare Pages. One-time setup (Pages project, API token): see MAINTAINERS.md.

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      # Package pages include the READMEs, and `<AutoTypeTable>` reads the package sources.
      - 'packages/**'
      - 'examples/*/README.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets wrangler-action attach the Pages deployment to the GitHub `docs` environment.
  deployments: write

concurrency:
  # Only the latest commit matters: a newer run supersedes an in-flight deploy.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: ai-sdk-harness

jobs:
  deploy:
    name: Deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The `lastModified` plugin reads each page's date from the git history.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs (static export)
        run: pnpm docs:build
        env:
          # Both optional: lib/constants.ts falls back to the pages.dev URL.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Uses the wrangler devDependency of docs (version pinned by the lockfile).
          packageManager: pnpm
          workingDirectory: docs
          command: >-
            pages deploy out
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
