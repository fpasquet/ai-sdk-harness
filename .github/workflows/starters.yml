name: Starters

# The starters as a user gets them today: installed with npm from the published packages, which a
# release of the AI SDK can break with no change here. Not required: a pull request cannot fix a
# published package before its release. ci.yml checks them against the packages of each commit.
# Called by the release workflow once it has published packages, not on every push to main: a
# starter whose ranges a release moves would install the versions before they are on npm.
on:
  workflow_call:
    inputs:
      packages:
        description: The packages just published, as changesets/action lists them, to wait for on npm
        required: false
        type: string
        default: '[]'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published:
    name: Starter (${{ matrix.starter }}, npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - starter: starter
            check: typecheck
          - starter: starter-next
            check: build
    defaults:
      run:
        working-directory: examples/${{ matrix.starter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A version just published takes a moment to show on npm, and its tarball a moment more.
      - name: Wait for the published versions on npm
        if: inputs.packages != '' && inputs.packages != '[]'
        env:
          PUBLISHED: ${{ inputs.packages }}
        run: |
          for package in $(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED"); do
            for _ in $(seq 30); do
              tarball=$(npm view "$package" dist.tarball 2>/dev/null || true)
              if [ -n "$tarball" ] && curl -fsSL -o /dev/null "$tarball"; then continue 2; fi
              sleep 10
            done
            echo "::error::$package is not on npm." && exit 1
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check the starter
        run: npm run ${{ matrix.check }}
